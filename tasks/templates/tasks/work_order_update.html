{% extends "base.html" %}
{% block title %}
  Редактирование наряда №{{ task.pk }} | EvoControl
{% endblock %}
{% block content %}
  <div class="details_card">
    <h2>Редактирование наряда №{{ task.pk }}</h2>
    <p class="description">Измените данные наряда-задания.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions">
        <button type="submit" class="button button-primary">Сохранить изменения</button>
        <a href="{% url 'work_order_detail' task.pk %}"
           class="button button-secondary">Отмена</a>
      </div>
    </form>
  </div>
{% endblock %}
