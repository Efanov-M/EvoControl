{% extends "base.html" %}
{% block title %}
  Добавление диспетчера | EvoControl
{% endblock %}
{% block content %}
  <div class="details_card">
    <h2>Добавление диспетчера</h2>
    <p class="description">Заполните данные нового диспетчера.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions">
        <button type="submit" class="button button-primary">Сохранить</button>
        <a href="{% url 'dispatchers_list' %}" class="button button-secondary">Отмена</a>
      </div>
    </form>
  </div>
{% endblock %}
