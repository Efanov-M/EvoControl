{% extends "base.html" %}
{% block title %}
  Редактирование диспетчера | EvoControl
{% endblock %}
{% block content %}
  <div class="details_card">
    <h2>Редактирование диспетчера</h2>
    <p class="description">Измените необходимые данные и сохраните изменения.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions">
        <button type="submit" class="button button-primary">Сохранить изменения</button>
        <a href="{% url 'dispatchers_list' %}" class="button button-secondary">Отмена</a>
      </div>
    </form>
  </div>
{% endblock %}
