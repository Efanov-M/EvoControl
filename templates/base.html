<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        EvoControl
        {% endblock %}
    </title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f3f5f7;
            color: #1f2937;
        }

        .header {
            background: #17202a;
            color: white;
            padding: 18px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 { margin: 0; font-size: 24px; }
        .header span { color: #aeb6bf; font-size: 14px; }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 32px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .topbar h2 { margin: 0 0 6px; }
        .topbar p { margin: 0; color: #6b7280; }

        .button {
            display: inline-block;
            padding: 11px 16px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }

        .card h3 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .plate {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .info {
            color: #6b7280;
            line-height: 1.7;
        }

        .details {
            display: block;
            margin-top: 18px;
            text-align: center;
            padding: 10px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            color: #64748b;
        }
    </style>
</head>

<body>

    {% include "includes/header.html" %}
    {% include "includes/navigation.html" %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
