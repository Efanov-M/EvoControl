{% block title %}
Добавление эвакуатора | EvoControl
{% endblock %}

{% block content %}





<div class="card">

    <h2>Редактирование эвакуатора</h2>

    <p class="description">
    Измените данные эвакуатора.
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="actions">

            <button type="submit" class="button primary">
            Сохранить
            </button>

            <a href="{% url 'fleet_list' %}" class="button secondary">
            Отмена
            </a>

        </div>

    </form>

</div>

{% endblock %}
