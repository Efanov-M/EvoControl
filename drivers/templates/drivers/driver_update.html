{% extends "base.html" %}
{% block title %}
  Редактирование водителя | EvoControl
{% endblock %}
{% block content %}
  <div class="details_card">
    <h1>Редактирование водителя</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions">
        <button class="button" type="submit">Сохранить изменения</button>
        <a class="button" href="{% url 'drivers_list' %}">Отмена</a>
      </div>
    </form>
  </div>
{% endblock %}
