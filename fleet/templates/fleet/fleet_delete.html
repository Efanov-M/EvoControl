<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Удаление эвакуатора</title>

<style>

*{box-sizing:border-box;}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f3f5f7;
color:#1f2937;
}

.header{
background:#17202a;
color:white;
padding:18px 32px;
}

.container{
max-width:700px;
margin:40px auto;
padding:0 20px;
}

.card{
background:white;
padding:30px;
border-radius:14px;
box-shadow:0 4px 16px rgba(0,0,0,.06);
}

.warning{
background:#fff7ed;
border:1px solid #fdba74;
padding:15px;
border-radius:10px;
color:#9a3412;
margin:20px 0;
}

.info{
background:#f8fafc;
padding:18px;
border-radius:10px;
margin:20px 0;
}

.actions{
display:flex;
gap:12px;
margin-top:30px;
}

.button{
border:none;
padding:11px 18px;
border-radius:8px;
cursor:pointer;
text-decoration:none;
font-weight:600;
}

.delete{
background:#dc2626;
color:white;
}

.cancel{
background:#e5e7eb;
color:#1f2937;
}

</style>

</head>

<body>

<header class="header">
<h1>EvoControl</h1>
</header>

<main class="container">

<div class="card">

<h2>Удаление эвакуатора</h2>

<div class="warning">
Это действие нельзя отменить.
</div>

<div class="info">

<h3>{{ fleet.brand }} {{ fleet.model }}</h3>

<p>Госномер: {{ fleet.license_plate }}</p>

<p>VIN: {{ fleet.vin }}</p>

<p>Тип: {{ fleet.get_truck_type_display }}</p>

</div>

<form method="post">

{% csrf_token %}

<div class="actions">

<button type="submit" class="button delete">
Удалить
</button>

<a href="/fleet/{{ fleet.pk }}/" class="button cancel">
Отмена
</a>

</div>

</form>

</div>

</main>

</body>
</html>
