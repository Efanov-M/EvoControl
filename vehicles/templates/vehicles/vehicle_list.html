<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Автомобили</title>
</head>
<body>

<h1>Автомобили</h1>

{% for vehicle in vehicles %}
    <p>
        {{ vehicle.brand }}
        {{ vehicle.model }}
        {{ vehicle.license_plate }}
    </p>
{% empty %}
    <p>Автомобилей пока нет.</p>
{% endfor %}

</body>
</html>
