<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стоянки | EvoControl</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f3f5f7;
            color: #1f2937;
        }

        .header {
            background: #17202a;
            color: white;
            padding: 18px 32px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 32px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }

        .active {
            background: #dcfce7;
            color: #166534;
        }

        .inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .details {
            display: block;
            margin-top: 18px;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header class="header">
    <h1>EvoControl</h1>
</header>

<main class="container">

    <h2>Спецстоянки</h2>
    <p>Стоянки службы эвакуации</p>

    <section class="grid">

        {% for item in parking %}

            <article class="card">

                <h3>{{ item.name }}</h3>

                <p>{{ item.address }}</p>

                {% if item.is_active %}
                    <span class="status active">Активна</span>
                {% else %}
                    <span class="status inactive">Неактивна</span>
                {% endif %}

                <a href="{{ item.pk }}/" class="details">
                    Открыть стоянку
                </a>

            </article>

        {% empty %}

            <p>Стоянок пока нет.</p>

        {% endfor %}

    </section>

</main>

</body>
</html>
