<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление эвакуатора | EvoControl</title>

    <style>
        * { box-sizing: border-box; }

        body{
            margin:0;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
            background:#f3f5f7;
            color:#1f2937;
        }

        .header{
            background:#17202a;
            color:white;
            padding:18px 32px;
        }

        .container{
            max-width:700px;
            margin:40px auto;
            padding:0 20px;
        }

        .card{
            background:white;
            border-radius:14px;
            padding:30px;
            border:1px solid #e5e7eb;
            box-shadow:0 4px 16px rgba(0,0,0,.06);
        }

        .description{
            color:#6b7280;
            margin-bottom:25px;
        }

        form p{
            margin-bottom:18px;
        }

        form input,
        form select{
            width:100%;
            padding:10px;
            border:1px solid #cbd5e1;
            border-radius:8px;
        }

        form input[type="checkbox"]{
            width:auto;
        }

        .actions{
            display:flex;
            gap:12px;
            margin-top:30px;
        }

        .button{
            border:none;
            padding:11px 18px;
            border-radius:8px;
            cursor:pointer;
            text-decoration:none;
            font-weight:600;
        }

        .primary{
            background:#2563eb;
            color:white;
        }

        .secondary{
            background:#e5e7eb;
            color:#1f2937;
        }
    </style>
</head>

<body>

<header class="header">
    <h1>EvoControl</h1>
</header>

<main class="container">

<div class="card">

<h2>Редактирование эвакуатора</h2>

<p class="description">
Измените данные эвакуатора.
</p>

<form method="post">

{% csrf_token %}

{{ form.as_p }}

<div class="actions">

<button type="submit" class="button primary">
Сохранить
</button>

<a href="/fleet/" class="button secondary">
Отмена
</a>

</div>

</form>

</div>

</main>

</body>
</html>
