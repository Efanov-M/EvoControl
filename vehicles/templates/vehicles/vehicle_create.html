<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Добавить автомобиль | EvoControl</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f3f5f7;
            color: #1f2937;
        }

        .header {
            background: #17202a;
            color: white;
            padding: 18px 32px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .description {
            margin-top: 0;
            margin-bottom: 28px;
            color: #6b7280;
        }

        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        form input[type="checkbox"] {
            width: auto;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .errorlist {
            margin: 5px 0;
            padding-left: 20px;
            color: #b91c1c;
        }

        .actions {
            margin-top: 28px;
            display: flex;
            gap: 12px;
        }

        .button {
            border: 0;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .button-primary {
            background: #2563eb;
            color: white;
        }

        .button-primary:hover {
            background: #1d4ed8;
        }

        .button-secondary {
            background: #e5e7eb;
            color: #1f2937;
        }
    </style>
</head>

<body>

<header class="header">
    <h1>EvoControl</h1>
</header>

<main class="container">

    <div class="card">

        <h2>Добавление автомобиля</h2>

        <p class="description">
            Заполните данные автомобиля.
        </p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="actions">
                <button
                    type="submit"
                    class="button button-primary"
                >
                    Сохранить
                </button>

                <a
                    href="/vehicles/"
                    class="button button-secondary"
                >
                    Отмена
                </a>
            </div>

        </form>

    </div>

</main>

</body>
</html>
