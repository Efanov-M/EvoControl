<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Удаление автомобиля | EvoControl</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f3f5f7;
            color: #1f2937;
        }

        .header {
            background: #17202a;
            color: white;
            padding: 18px 32px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .warning {
            background: #fff7ed;
            border: 1px solid #fdba74;
            color: #9a3412;
            padding: 16px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .vehicle-info {
            background: #f8fafc;
            border-radius: 10px;
            padding: 18px;
            margin: 20px 0;
        }

        .vehicle-info h3 {
            margin-top: 0;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .button {
            border: 0;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .button-danger {
            background: #dc2626;
            color: white;
        }

        .button-danger:hover {
            background: #b91c1c;
        }

        .button-secondary {
            background: #e5e7eb;
            color: #1f2937;
        }
    </style>
</head>

<body>

<header class="header">
    <h1>EvoControl</h1>
</header>

<main class="container">

    <div class="card">

        <h2>Удаление автомобиля</h2>

        <div class="warning">
            Это действие нельзя отменить.
        </div>

        <div class="vehicle-info">
            <h3>{{ vehicle.brand }} {{ vehicle.model }}</h3>
            <p>Госномер: {{ vehicle.license_plate }}</p>
            <p>Цвет: {{ vehicle.color }}</p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="actions">
                <button type="submit" class="button button-danger">
                    Удалить
                </button>

                <a href="/vehicles/{{ vehicle.pk }}/" class="button button-secondary">
                    Отмена
                </a>
            </div>
        </form>

    </div>

</main>

</body>
</html>
