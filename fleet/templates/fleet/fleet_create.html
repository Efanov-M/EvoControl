{% extends "base.html" %}

{% block title %}
Добавление эвакуатора  | EvoControl
{% endblock %}

{% block content %}
 


<div class="card">

    <h2>Добавление эвакуатора</h2>

    <p class="description">Заполните данные нового эвакуатора.</p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="actions">

            <button type="submit" class="button primary">Сохранить</button>

            <a href="{% 'fleet_list' %}" class="button secondary">
                Отмена
            </a>

        </div>

    </form>

</div>

{% endblock %}
